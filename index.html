<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bizim hikâyemiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#efe3cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--fg:#efe3cc}}
:root[data-theme="dark"]{--bg:#000;--fg:#efe3cc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
svg#stage{width:100%;height:100%;display:block}
.cue{font-family:'Caveat','Segoe Print','Bradley Hand',cursive;font-weight:700;fill:#fbf1dc;stroke:#2a190f;stroke-width:9px;paint-order:stroke;stroke-linejoin:round;letter-spacing:.4px}
.cue.end{stroke:none;fill:#eadcc2;font-weight:500}
#grain,#vig{position:fixed;inset:0;pointer-events:none}
#grain{opacity:.07;background-size:256px 256px}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(20,10,4,.45) 100%)}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0a0705;color:var(--fg);font-family:'Caveat',cursive;z-index:5;cursor:pointer}
#start button{width:104px;height:104px;border-radius:50%;border:2px solid #d9c29a;background:transparent;color:#f3e6cc;font-size:40px;padding-left:8px;cursor:pointer}
#start button:focus-visible{outline:3px solid #f3d38e;outline-offset:6px}
#start p{margin:0;font-size:24px;opacity:.7}
#again{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;background:transparent;border:1px solid #5a4a3a;color:#8a7a66;border-radius:30px;padding:8px 18px;font-family:'Caveat',cursive;font-size:22px;z-index:6}
@media (prefers-reduced-motion: reduce){#grain{opacity:.08}}
</style>
</head>

<script>
/* ------------------------------------------------------------------ */
/*  Basics                                                            */
/* ------------------------------------------------------------------ */
const FPS = 18, TOTAL = 108.5;
const INK = '#3a281e', SKIN = '#efc6a1', HM = '#2b1d16', HF = '#6e4526';
const f = n => +(+n).toFixed(1);
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const E = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const P = (t, a, b) => cl((t - a) / (b - a));
const EP = (t, a, b) => E(P(t, a, b));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const ST = (w, c = INK) => `fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
const SK = (w = 2.4) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round"`;
const dline = (d, col, w) => `<path d="${d}" ${ST(w + 5)}/><path d="${d}" ${ST(w, col)}/>`;
function mix(a, b, k) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join('');
}
let MODE = 'p';
const KP = 16 / 9;
function cam(fx, fy, z, rot = 0, t = 0, free = false) {
  const jx = Math.sin(t * 1.3) * 3 + Math.sin(t * 2.9) * 1.5, jy = Math.cos(t * 1.1) * 2.5;
  if (MODE === 'l') return `translate(800,450) scale(${f(z * 1000) / 1000}) rotate(${f(rot)}) translate(${f(-fx - jx)},${f(-fy - jy)})`;
  const Z = z * KP; let X = fx + jx, Y = fy + jy;
  if (!free) { const hw = 450 / Z, hh = 800 / Z; X = cl(X, hw, 1600 - hw); Y = hh >= 450 ? 450 : cl(Y, hh, 900 - hh); }
  return `translate(450,800) scale(${f(Z * 1000) / 1000}) rotate(${f(rot)}) translate(${f(-X)},${f(-Y)})`;
}
function hand(str, x, y, size, k, opt = {}) {
  const w = str.length * size * .46 + 40, id = 'h' + Math.round(x) + '_' + Math.round(y);
  return `<g transform="rotate(${opt.rot || 0} ${x} ${y})"><clipPath id="${id}"><rect x="${f(x - w / 2)}" y="${f(y - size)}" width="${f(w * cl(k))}" height="${f(size * 1.7)}"/></clipPath>` +
    `<text x="${x}" y="${y}" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="${size}" fill="${opt.col || INK}" ${k < 1 ? `clip-path="url(#${id})"` : ''}>${str}</text></g>`;
}

/* ------------------------------------------------------------------ */
/*  Characters                                                        */
/* ------------------------------------------------------------------ */
function faceSVG(o, fem) {
  const lx = o.lx || 0, ey = -256, px = o.px || 0, py = o.py || 0;
  let s = '';
  [-1, 1].forEach(d => {
    const cx = d * 12 + lx;
    let e = o.eyes || 'open';
